name: Build Antigravity Gateway Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Standalone Windows x64 Single-File Executable
      run: |
        dotnet publish AntigravityGateway/AntigravityGateway.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true -o ./dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntigravityGatewayPro
        path: ./dist/AntigravityGateway.exe
